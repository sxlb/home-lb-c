name: Build & Release

# 每次 push 到 master 自动构建并发布一个新版本（也支持手动触发）。
# 版本号采用语义化版本：0.0.1 → 0.0.2 → 0.0.3 ...，每次基于已发布的最大 tag 自动 patch+1，
# 首次发布为 0.0.1。中国时区（Asia/Shanghai）时间记录在 GitHub Release 标题与说明中。
on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 完整历史 + tags：供版本递增与 Release Notes 的 CHANGELOG 链接使用
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          # 取已发布的最大语义化版本（0.0.1 或 v0.0.1），patch+1；无则首发 0.0.1
          PREV=$(git tag -l | grep -E '^v?[0-9]+(\.[0-9]+){2}$' | sed -E 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          if [ -n "$PREV" ]; then
            MAJ=${PREV%%.*}; _r=${PREV#*.}; MIN=${_r%%.*}; PAT=$(( ${_r##*.} + 1 ))
            VERSION="$MAJ.$MIN.$PAT"
          else
            VERSION="0.0.1"
          fi
          # 中国时区（Asia/Shanghai）时间：写入 Release 标题 / 说明
          CN_TIME=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG=$VERSION" >> "$GITHUB_OUTPUT"
          echo "CN_TIME=$CN_TIME" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # 将本次 release 版本同步进 package.json / package-lock.json（仅工作区，不提交回仓库，避免 CI 循环），
      # 使构建产物内嵌的"当前版本"（CURRENT_VERSION）与本次发布版本一致。
      # 不用 `npm version`：当版本与现有值相同时它会以 "Version not changed" 报错（exit 1）而打断首发构建。
      - name: Sync version into package.json
        run: |
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            for (const f of ["package.json", "package-lock.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
          ' "${{ steps.version.outputs.VERSION }}"

      - name: Install dependencies
        run: npm ci

      - name: Prepare database & build
        env:
          DATABASE_URL: file:./prisma/ci.db
        run: |
          # 首页为 ISR，构建期会查询 Profile，需要先迁移出一个可用空库
          npx prisma migrate deploy
          npm run build

      - name: Generate release notes
        run: python3 .github/scripts/release-notes.py
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          TAG: ${{ steps.version.outputs.TAG }}
          CN_TIME: ${{ steps.version.outputs.CN_TIME }}
          REPO: sxlb/home-lb-c

      - name: Package standalone artifact
        run: |
          set -euo pipefail
          mkdir -p dist/home-lb
          cp -r .next/standalone/. dist/home-lb/
          cp -r .next/static dist/home-lb/.next/static
          cp -r public dist/home-lb/public
          cp -r prisma dist/home-lb/prisma
          cp package.json package-lock.json dist/home-lb/
          cp Dockerfile docker-compose.yml docker-compose.image.yml deploy.sh deploy.ps1 .env.deploy.example dist/home-lb/
          tar -C dist -czf "home-lb-${{ steps.version.outputs.TAG }}.tar.gz" home-lb

      # ---------- 推送 GHCR 镜像（供服务器"拉取镜像"更新模式使用） ----------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/sxlb/home-lb-c:${{ steps.version.outputs.TAG }}
            ghcr.io/sxlb/home-lb-c:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: home-lb ${{ steps.version.outputs.VERSION }} · ${{ steps.version.outputs.CN_TIME }} (UTC+8)
          body_path: RELEASE_NOTES.md
          files: home-lb-${{ steps.version.outputs.TAG }}.tar.gz